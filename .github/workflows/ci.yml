name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wavy
          POSTGRES_PASSWORD: wavy
          POSTGRES_DB: wavy
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wavy -d wavy"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      # Same values as .env.example, so `pnpm test` runs here exactly as it does
      # against the compose container. The integration bootstrap creates
      # `wavy_test` itself.
      DATABASE_URL: postgres://wavy:wavy@localhost:5433/wavy
      TEST_DATABASE_URL: postgres://wavy:wavy@localhost:5433/wavy_test
      AUTH_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
